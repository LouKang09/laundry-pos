name: Build and workflow tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: laundry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://laundry:ci-only-password@localhost:5432/laundry_test
      TEST_DATABASE_URL: postgresql://laundry:ci-only-password@localhost:5432/laundry_test
      NODE_ENV: test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:ui
